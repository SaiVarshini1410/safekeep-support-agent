<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''">
    <title th:text="${title} + ' · SafeKeep Support Agent'">SafeKeep</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/app.js" defer></script>
</head>
<body>
<aside th:fragment="sidebar" class="sidebar">
    <a href="/investigations" class="brand">
        <span class="brand-mark">◆</span>
        <span><strong>SafeKeep</strong><small>Support Agent</small></span>
    </a>
    <nav>
        <a href="/investigations" th:classappend="${active == 'investigations'} ? 'active'">Investigations</a>
        <a href="/simulator" th:classappend="${active == 'simulator'} ? 'active'">Event Simulator</a>
        <a href="/applications" th:if="${me.admin}" th:classappend="${active == 'applications'} ? 'active'">Applications</a>
        <a href="/health" th:if="${me.support}" th:classappend="${active == 'health'} ? 'active'">Health &amp; Metrics</a>
    </nav>
    <div class="user">
        <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">S</div>
        <div class="user-meta">
            <span th:text="${me.name}">sam</span>
            <small th:text="${@fmt.label(me.role)}">Support engineer</small>
        </div>
        <form method="post" action="/logout">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link" type="submit" title="Sign out">Sign out</button>
        </form>
    </div>
</aside>
</body>
</html>
