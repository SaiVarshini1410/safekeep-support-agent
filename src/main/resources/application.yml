spring:
  application:
    name: support-agent
  config:
    import:
      - classpath:apps/backup-server.yml
      - classpath:apps/storage-server.yml
  datasource:
    url: jdbc:h2:file:./data/safekeep
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

safekeep:
  api-keys:
    backup-server: ${BACKUP_SERVER_API_KEY:}
    storage-server: ${STORAGE_SERVER_API_KEY:}
  agent:
    ollama-url: http://localhost:11434
    model: llama3.2:3b
    temperature: 0.1
    max-tool-calls: 8
    llm-timeout-seconds: 60
    llm-retries: 2
    retry-backoff-ms: 1000
    tool-timeout-seconds: 5
    max-tool-result-chars: 1500
    proposal-ttl-minutes: 15
    worker-threads: 4
